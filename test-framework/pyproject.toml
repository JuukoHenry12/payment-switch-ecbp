[tool.poetry]
name = "ecbp-tests"
version = "0.1.0"
description = "Test automation framework for ECBP"
authors = ["Balasubramani P"]

[tool.poetry.dependencies]
python = "^3.11"
pytest = "^8.2"
pytest-xdist = "^3.6"
pytest-html = "^4.1"
requests = "^2.32"
httpx = "^0.27"
zeep = "^4.2"
ibm-db = "^3.2"
pydantic = "^2.7"
playwright = "^1.44"
pytest-playwright = "^0.5"
click = "^8.1"

[tool.poetry.group.dev.dependencies]
black = "^24.4"
ruff = "^0.5"
mypy = "^1.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
