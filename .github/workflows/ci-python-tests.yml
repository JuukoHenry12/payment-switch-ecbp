name: CI - Python Test Framework
on:
  push:
    paths:
      - 'test-framework/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        working-directory: test-framework
        run: poetry install
      - name: Run tests
        working-directory: test-framework
        run: poetry run pytest ecbp_tests/api_tests
